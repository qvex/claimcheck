[project]
name = "claimcheck-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic", "pydantic-settings",
  "sqlalchemy>=2.0", "psycopg[binary]", "pgvector",
  "langgraph", "langgraph-checkpoint-postgres", "langchain-google-genai",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]   # without this, setuptools also finds data/ and tests/ and refuses to build

[tool.pytest.ini_options]
testpaths = ["tests"]
